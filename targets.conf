# targets.conf — mapping of existing *-recon folders to their real domain(s)
# Format: <folder> <domain> [domain2 ...]
# Multiple domains on one line means the folder covers several root domains
# (per-source files get a domain-suffix, e.g. subfinder_supercell.txt).
apple-itunes-recon  itunes.apple.com
apple-music-recon   music.apple.com
atlassian-recon      atlassian.net
brawlstars-recon     supercell.com brawlstarsgame.com
context7-recon       context7.com
figma-recon          figma.com
jetmail-recon        jetmail.atlassian.net
xbox-recon           xbox.com
xda-recon            xda-developers.com
